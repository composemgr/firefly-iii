# nginx proxy address - http://172.17.0.1:8080

name: firefly-iii
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  firefly-iii:
    image: fireflyiii/core:latest
    pull_policy: always
    container_name: firefly-iii-app
    restart: always
    logging: *default-logging
    networks:
      - firefly-iii
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8080:8080"
    environment:
      TZ: ${TZ:-America/New_York}
      APP_KEY: ${APP_SECRET_KEY:-changeme_secret_key_32characters}
      DB_HOST: firefly-iii-db
      DB_PORT: "3306"
      DB_CONNECTION: mysql
      DB_DATABASE: ${DB_CREATE_DATABASE_NAME:-firefly}
      DB_USERNAME: ${DB_USER_NAME:-firefly}
      DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MAIL_MAILER: smtp
      MAIL_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      MAIL_PORT: ${EMAIL_SERVER_PORT:-587}
      MAIL_FROM: ${APP_ADMIN_EMAIL:-firefly@example.com}
      MAIL_USERNAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      MAIL_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      MAIL_ENCRYPTION: tls
      APP_URL: http://${BASE_HOST_NAME:-localhost}:8080
      TRUSTED_PROXIES: "**"
      CONTAINER_NAME: firefly-iii-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/data/firefly-iii:/var/www/html/storage/upload
    depends_on:
      - firefly-iii-db
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://firefly-iii-app:8080'
      - 'cloudflare.hostname=firefly-iii.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.firefly-iii-app.entrypoints=http'
      - 'traefik.http.routers.firefly-iii-app-secure.tls=true'
      - 'traefik.http.routers.firefly-iii-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.firefly-iii-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.firefly-iii-app.middlewares=firefly-iii-app-https-redirect'
      - 'traefik.http.routers.firefly-iii-app-secure.entrypoints=https'
      - 'traefik.http.routers.firefly-iii-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.firefly-iii-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.firefly-iii-app-secure.service=firefly-iii-app'
      - 'traefik.http.services.firefly-iii-app.loadbalancer.server.port=8080'

  firefly-iii-db:
    image: mariadb:latest
    pull_policy: always
    container_name: firefly-iii-db
    restart: always
    logging: *default-logging
    networks:
      - firefly-iii
    environment:
      TZ: ${TZ:-America/New_York}
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-firefly}
      MARIADB_USER: ${DB_USER_NAME:-firefly}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
      CONTAINER_NAME: firefly-iii-db
    volumes:
      - ./volumes/data/db/mariadb/firefly-iii:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  firefly-iii:
    name: firefly-iii
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
